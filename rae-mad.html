<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask RAE · MAD Business Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F6;
    --white:#FFFFFF;
    --charcoal:#2A2A29;
    --gray:#6F7272;
    --green:#008000;
    --green-dark:#006400;
    --gold:#DDB750;
    --line:rgba(42,42,41,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--charcoal);
    font-family:'Jost', sans-serif; font-size:16px; line-height:1.55;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  header{background:var(--white); text-align:center; padding:20px 22px 0; border-bottom:4px solid var(--green);}
  .logo{display:block; width:min(340px, 82vw); height:auto; margin:0 auto;}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  .sub{
    color:var(--charcoal); font-size:14px; font-weight:500; padding:12px 0 14px;
    border-top:1px solid var(--gold); margin:14px auto 0; max-width:420px;
  }

  main{flex:1; display:flex; flex-direction:column; max-width:640px; width:100%; margin:0 auto;}
  #msgs{flex:1; overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:12px;}
  .msg{max-width:86%; padding:12px 16px; border-radius:14px; font-size:15px; white-space:pre-wrap; word-wrap:break-word;}
  .rae-m{background:var(--white); color:var(--charcoal); align-self:flex-start; border-left:3px solid var(--green); border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(42,42,41,0.08);}
  .rae-m b{color:var(--green); font-weight:600; letter-spacing:.02em;}
  .rae-m a{color:var(--green-dark); font-weight:600;}
  .user-m{background:var(--charcoal); color:var(--white); align-self:flex-end; border-bottom-right-radius:4px;}
  .snap-btn{align-self:flex-start; background:var(--green); color:#fff; border:0; border-radius:999px; padding:11px 18px; font:600 14px 'Jost', sans-serif; cursor:pointer;}
  .snap-btn:hover{background:var(--green-dark);}
  .reply-chips{display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; max-width:92%;}
  .reply-chip{background:var(--white); color:var(--green-dark); border:1.5px solid var(--green); border-radius:999px; padding:8px 14px; font:500 13px 'Jost', sans-serif; cursor:pointer;}
  .reply-chip:hover{background:var(--green); color:#fff;}
  .stage{display:block; margin-top:8px; font-size:13px; color:var(--charcoal);}
  .stage b{color:var(--green);}
  .bp-card{align-self:flex-start; max-width:92%; background:var(--charcoal); color:#fff; border-radius:14px; padding:16px 18px; border-top:3px solid var(--gold);}
  .bp-card .k{font:600 11px 'Jost', sans-serif; letter-spacing:.14em; color:var(--gold); text-transform:uppercase;}
  .bp-card .t{font:600 18px 'Jost', sans-serif; margin:4px 0 12px;}
  .bp-card button{background:var(--gold); color:var(--charcoal); border:0; border-radius:999px; padding:9px 16px; font:600 13px 'Jost', sans-serif; cursor:pointer; margin:0 6px 6px 0;}
  .bp-card button.ghost{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5);}
  body.vip header{border-bottom-color:var(--gold);}
  body.vip .badge{background:var(--charcoal); color:var(--gold); border:1px solid var(--gold);}
  body.vip .badge button{color:var(--gold);}
  body.vip .rae-m{border-left-color:var(--gold);}
  body.vip .rae-m b{color:var(--charcoal);}
  body.vip .input-row button{background:var(--charcoal);}
  body.vip .reply-chip{border-color:var(--charcoal); color:var(--charcoal);}
  body.vip .reply-chip:hover{background:var(--charcoal); color:#fff;}
  .view-bp{background:none; border:0; color:var(--green-dark); font:600 13px 'Jost', sans-serif; text-decoration:underline; cursor:pointer; margin-left:8px;}
  .typing{align-self:flex-start; color:var(--gray); font-style:italic; font-size:14px; padding-left:6px;}

  .chips{display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 12px;}
  .chip{
    background:var(--white); color:var(--charcoal); border:1px solid var(--line);
    border-radius:999px; padding:8px 14px; font:500 13px 'Jost', sans-serif; cursor:pointer;
  }
  .chip:hover{border-color:var(--green); color:var(--green);}

  .input-row{display:flex; gap:8px; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--white);}
  .input-row input{
    flex:1; background:var(--bg); color:var(--charcoal); border:1px solid var(--line);
    border-radius:999px; padding:13px 18px; font:16px 'Jost', sans-serif;
  }
  .input-row input::placeholder{color:var(--gray);}
  .input-row button{
    background:var(--green); color:#fff; border:0; border-radius:999px; padding:0 22px;
    font:600 15px 'Jost', sans-serif; cursor:pointer;
  }
  .input-row button:hover{background:var(--green-dark);}
  .input-row button:disabled{opacity:.5; cursor:default;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .access{padding:0 0 14px;}
  .access-link{background:none; border:0; color:var(--green-dark); font:600 14px 'Jost', sans-serif; text-decoration:underline; cursor:pointer;}
  .code-row{display:none; gap:8px; justify-content:center; margin-top:10px;}
  .code-row.open{display:flex;}
  .code-row input{width:170px; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:10px 14px; font:15px 'Jost', sans-serif; color:var(--charcoal);}
  .code-row button{background:var(--charcoal); color:#fff; border:0; border-radius:999px; padding:0 16px; font:600 14px 'Jost', sans-serif; cursor:pointer;}
  .code-msg{font-size:13px; color:var(--gray); margin-top:8px; min-height:1em;}
  .badge{display:inline-block; background:var(--green); color:#fff; font:600 12px 'Jost', sans-serif; letter-spacing:.06em; text-transform:uppercase; padding:6px 12px; border-radius:999px;}
  .badge button{background:none; border:0; color:#fff; opacity:.8; margin-left:8px; font:500 12px 'Jost', sans-serif; text-decoration:underline; cursor:pointer;}
</style>
</head>

<script>
/* RAE's MAD instructions and paid content live on the server (api/mad.js), not on this page. */
const BOOK_CALL = "https://calendly.com/rasheaedmond/tb";
const MAD_SITE = "https://bookwithmad.com";
const TIER_NAMES = { diy: "MAD DIY + AI Member", blueprint: "MAD Blueprint Member" };
const WELCOME = {
  free: "Hey! I'm RAE. Tell me what you're trying to accomplish with your business right now, and I'll point you to the right door.",
  diy: "Welcome in! Your MAD DIY + AI access is unlocked. You build it yourself, but you don't build it by yourself. You don't need to know what to ask. I'll lead. Tap \"Start here\" and we'll begin with your foundation check.",
  blueprint: "Welcome in! Your MAD Blueprint is unlocked. This one is built around YOU: your business and you, the owner. I'll lead the way. Tap \"Start my review\" and we'll look at where both sides stand, then I'll build YOUR blueprint."
};

const msgsEl = document.getElementById('msgs');
const input  = document.getElementById('raeInput');
const sendBtn = document.getElementById('raeSend');
const accessEl = document.getElementById('access');
let history = [];
let busy = false;
let accessCode = '';
let tier = 'free';
let stage = '';
const FREE_CHIPS = document.getElementById('chips').innerHTML;
const MEMBER_CHIPS = ['Start here', "What's my next step?", 'Check my progress', "I'm stuck"];
const VIP_CHIPS_NEW = ['Start my review', 'How does this work?'];
const VIP_CHIPS = ["What's my next move?", 'Check my progress', "I'm stuck", 'Update my blueprint'];
let blueprint = '';
let who = (() => { try { return JSON.parse(load('madWho') || 'null') || {}; } catch(e){ return {}; } })();

function saveProgress(){
  if (tier === 'free') return;
  store('madProgress', JSON.stringify({ tier, stage, history: history.slice(-30) }));
}
function loadProgress(){
  try { const p = JSON.parse(load('madProgress') || 'null'); return (p && p.tier === tier) ? p : null; } catch(e){ return null; }
}
function setChips(){
  const box = document.getElementById('chips');
  if (tier === 'free') { box.innerHTML = FREE_CHIPS; }
  else {
    const list = tier === 'blueprint' ? (blueprint ? VIP_CHIPS : VIP_CHIPS_NEW) : MEMBER_CHIPS;
    box.innerHTML = list.map(q => `<button class="chip" data-q="${q}">${q}</button>`).join('');
  }
  box.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => sendToRae(c.dataset.q)));
}
function showStage(){
  const el = document.getElementById('stageLine');
  if (!el) return;
  el.innerHTML = stage ? `You're on: <b>${stage.replace(/</g,'&lt;')}</b>` : '';
  if (tier === 'blueprint' && blueprint) {
    const b = document.createElement('button');
    b.className = 'view-bp'; b.textContent = 'View my blueprint';
    b.onclick = () => downloadBlueprint(blueprint);
    el.appendChild(b);
  }
}

function store(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
function load(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }

function linkify(text){
  return text.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
    let trail = '';
    while (/[.,!?;:)]$/.test(url)) { trail = url.slice(-1) + trail; url = url.slice(0, -1); }
    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>${trail}`;
  });
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function snapshotDoc(body){
  const logo = document.querySelector('.logo').src;
  const date = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  const heads = ['WHERE YOU STAND','YOUR TOP 3 PRIORITIES','FREE QUICK WIN',"MAD'S GIFT TO YOU",'YOUR MAD JUMPSTART','YOUR BEST NEXT STEP'];
  const html = escapeHtml(body).split('\n').map(l => {
    const line = l.trim();
    if (!line) return '';
    if (heads.includes(line.toUpperCase())) return `<h2>${line}</h2>`;
    return `<p>${linkify(line)}</p>`;
  }).join('');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Free MAD Credit Snapshot</title>
<style>
 body{font-family:Arial,Helvetica,sans-serif; color:#2A2A29; max-width:680px; margin:0 auto; padding:28px 22px; line-height:1.55;}
 img{display:block; width:260px; max-width:80%; margin:0 auto 6px;}
 .bar{height:6px; background:#008000; margin:12px 0 18px;}
 h1{font-size:22px; text-align:center; margin:0;} .date{text-align:center; color:#6F7272; font-size:13px; margin-top:4px;}
 h2{font-size:14px; letter-spacing:.08em; color:#008000; border-bottom:1px solid #DDB750; padding-bottom:4px; margin-top:24px;}
 p{margin:6px 0;} a{color:#006400; font-weight:bold;}
 .cta{margin-top:28px; background:#F4F6F6; border-left:4px solid #008000; padding:16px 18px;}
 .cta h3{margin:0 0 8px; font-size:17px;}
 .note{font-size:11px; color:#6F7272; margin-top:24px;}
 .print{display:block; margin:24px auto 0; background:#008000; color:#fff; border:0; border-radius:999px; padding:12px 24px; font-size:15px; font-weight:bold;}
 @media print{ .print{display:none;} }
</style></head><body>
<img src="${logo}" alt="MAD Business Solutions">
<h1>My Free Credit Snapshot</h1><div class="date">${[who.name, who.business].filter(Boolean).map(escapeHtml).join(' · ')}${(who.name || who.business) ? ' · ' : ''}${date}</div><div class="bar"></div>
${html}
<div class="cta"><h3>Ready to Become the Asset™?</h3>
<p>This snapshot shows where you stand. The full plan shows you exactly how to move. Pick up where RAE left off at <a href="${MAD_SITE}">${MAD_SITE}</a>, or book a call with Rashea: <a href="${BOOK_CALL}">${BOOK_CALL}</a></p></div>
<p class="note">This snapshot is for education only. It is not a credit report, financial advice, or a guarantee of any result.</p>
<button class="print" onclick="window.print()">Save as PDF</button>
</body></html>`;
}

function blueprintDoc(body){
  const logo = document.querySelector('.logo').src;
  const date = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  const heads = /^(WHERE YOU STAND|WHAT NEEDS ATTENTION FIRST|PHASE \d.*|BUILD THE BUSINESS PROFILE|YOUR RESOURCES|YOUR VENDOR ACCOUNT STRATEGY|YOUR PG \+ NON-PG STRATEGY|YOUR FIRST MOVE)$/i;
  let prepared = '';
  const html = escapeHtml(body).split('\n').map(l => {
    const line = l.trim();
    if (!line) return '';
    if (/^PREPARED FOR:/i.test(line)) { prepared = line.replace(/^PREPARED FOR:\s*/i, ''); return ''; }
    if (heads.test(line)) return `<h2>${line}</h2>`;
    if (/^Ready to move on when:/i.test(line)) return `<p class="gate">${linkify(line)}</p>`;
    if (/^(Business|You, the Owner|Funding Readiness):/i.test(line)) { const i = line.indexOf(':'); return `<p><b>${line.slice(0,i+1)}</b>${linkify(line.slice(i+1))}</p>`; }
    return `<p>${linkify(line)}</p>`;
  }).join('');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My MAD Blueprint</title>
<style>
 body{font-family:Arial,Helvetica,sans-serif; color:#2A2A29; margin:0; line-height:1.55; background:#fff;}
 .top{background:#2A2A29; color:#fff; text-align:center; padding:26px 20px 22px; border-bottom:4px solid #DDB750;}
 .logo{background:#fff; display:inline-block; padding:8px 12px; border-radius:6px;}
 .logo img{display:block; width:220px; max-width:60vw;}
 .k{color:#DDB750; letter-spacing:.2em; font-size:12px; font-weight:bold; margin-top:16px;}
 h1{margin:4px 0 0; font-size:28px;} .for{color:#E7E3D8; font-size:14px; margin-top:6px;}
 main{max-width:720px; margin:0 auto; padding:10px 24px 30px;}
 h2{font-size:13px; letter-spacing:.12em; color:#2A2A29; border-bottom:2px solid #DDB750; padding-bottom:5px; margin-top:26px; text-transform:uppercase;}
 p{margin:6px 0;} a{color:#006400; font-weight:bold;}
 .gate{background:#F4F6F6; border-left:4px solid #008000; padding:8px 12px; font-weight:bold; margin-top:10px;}
 .ceo{margin-top:30px; text-align:center; font-weight:bold; letter-spacing:.04em;}
 .note{font-size:11px; color:#6F7272; margin-top:20px;}
 .print{display:block; margin:22px auto 0; background:#2A2A29; color:#DDB750; border:0; border-radius:999px; padding:12px 26px; font-size:15px; font-weight:bold;}
 @media print{ .print{display:none;} .top{-webkit-print-color-adjust:exact; print-color-adjust:exact;} .gate{-webkit-print-color-adjust:exact; print-color-adjust:exact;} }
</style></head><body>
<div class="top"><div class="logo"><img src="${logo}" alt="MAD Business Solutions"></div>
<div class="k">BUSINESS + PERSONAL. ONE BLUEPRINT.</div><h1>My MAD Blueprint</h1>
<div class="for">${prepared ? 'Prepared for ' + prepared + ' · ' : ''}${date}</div></div>
<main>${html}
<p class="ceo">You're still the CEO. We're just taking the guesswork out of the game plan.</p>
<p class="note">Your MAD Blueprint is for education and strategy only. It is not legal or financial advice, a credit report, or a guarantee of approval, scores, funding, or any result. Lenders, vendors, and card issuers set their own requirements.</p>
<button class="print" onclick="window.print()">Save as PDF</button></main>
</body></html>`;
}

function downloadBlueprint(body){
  const blob = new Blob([blueprintDoc(body)], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if (!win) {
    const a = document.createElement('a');
    a.href = url; a.download = 'My-MAD-Blueprint.html';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

function downloadSnapshot(body){
  const blob = new Blob([snapshotDoc(body)], { type:'text/html' });
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if (!win) {
    const a = document.createElement('a');
    a.href = url; a.download = 'My-MAD-Credit-Snapshot.html';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

function addMsg(role, text){
  let snapshot = null;
  let replies = [];
  let newBlueprint = null;
  document.querySelectorAll('.reply-chips').forEach(el => el.remove());
  if (role !== 'user') {
    const nm = text.match(/\[\[NAME:\s*([^\]|]*)\|?\s*([^\]]*)\]\]/i);
    if (nm) {
      const n = nm[1].trim(), b = nm[2].trim();
      if (n) who.name = n;
      if (b) who.business = b;
      store('madWho', JSON.stringify(who));
    }
    text = text.replace(/\[\[NAME:[^\]]*\]\]/gi, '');
    const st = text.match(/\[\[STAGE:\s*([^\]]+)\]\]/i);
    if (st) { stage = st[1].trim(); showStage(); }
    text = text.replace(/\[\[STAGE:[^\]]*\]\]/gi, '');
    const lines = text.trim().split('\n');
    const last = lines[lines.length - 1] || '';
    if (last.trim().startsWith('>>')) {
      replies = last.replace('>>', '').split('|').map(s => s.trim().replace(/^\[|\]$/g, '').replace(/^"|"$/g, '')).filter(Boolean).slice(0, 3);
      lines.pop();
    }
    text = lines.join('\n').trim();
    const bp = text.match(/===MAD BLUEPRINT===([\s\S]*?)===END BLUEPRINT===/);
    if (bp) {
      newBlueprint = bp[1].trim();
      text = text.replace(bp[0], '').trim();
    }
    const m = text.match(/===MAD SNAPSHOT===([\s\S]*?)===END SNAPSHOT===/);
    if (m) {
      snapshot = m[1].trim();
      text = text.replace(m[0], snapshot);
    }
  }
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user-m' : 'rae-m');
  if (role === 'user') { div.textContent = text; }
  else { div.innerHTML = '<b>RAE:</b> ' + linkify(text.replace(/&/g,'&amp;').replace(/</g,'&lt;')); }
  if (text) msgsEl.appendChild(div);
  if (newBlueprint) {
    blueprint = newBlueprint; store('madBlueprint', blueprint);
    const card = document.createElement('div');
    card.className = 'bp-card';
    card.innerHTML = '<div class="k">MAD Business Solutions</div><div class="t">Your MAD Blueprint is ready.</div>';
    const d = document.createElement('button'); d.textContent = 'Download my MAD Blueprint'; d.onclick = () => downloadBlueprint(blueprint);
    card.appendChild(d);
    msgsEl.appendChild(card);
    setChips(); showStage();
    text = (text ? text + '\n' : '') + '[I created their MAD Blueprint — it is saved and sent with every message.]';
  }
  if (replies.length) {
    const wrap = document.createElement('div');
    wrap.className = 'reply-chips';
    replies.forEach(r => {
      const b = document.createElement('button');
      b.className = 'reply-chip'; b.textContent = r;
      b.onclick = () => sendToRae(r);
      wrap.appendChild(b);
    });
    msgsEl.appendChild(wrap);
  }
  if (snapshot) {
    const btn = document.createElement('button');
    btn.className = 'snap-btn';
    btn.textContent = 'Download my free snapshot';
    btn.onclick = () => downloadSnapshot(snapshot);
    msgsEl.appendChild(btn);
  }
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return text;
}

function resetChat(){
  history = []; stage = '';
  blueprint = tier === 'blueprint' ? load('madBlueprint') : '';
  document.body.classList.toggle('vip', tier === 'blueprint');
  msgsEl.innerHTML = '';
  setChips();
  const saved = loadProgress();
  if (saved && saved.history && saved.history.length) {
    history = saved.history; stage = saved.stage || '';
    history.forEach(m => addMsg(m.role, m.content));
    addMsg('rae', tier === 'blueprint' && blueprint
      ? `Welcome back${who.name ? ', ' + who.name : ''}! Your MAD Blueprint is right here. Tap "What's my next move?" and we'll keep working YOUR plan.`
      : `Welcome back${who.name ? ', ' + who.name : ''}! Let's pick up where you left off. Tap "What's my next step?" when you're ready.`);
  } else if (tier === 'blueprint' && blueprint) {
    addMsg('rae', `Welcome back${who.name ? ', ' + who.name : ''}! Your MAD Blueprint is right here. Tap "What's my next move?" and we'll keep working YOUR plan.`);
  } else {
    let w = WELCOME[tier];
    if (who.name) w = w.replace(/^(Hey!|Welcome in!)/, (m0) => m0.replace('!', '') + ' ' + who.name + '!');
    addMsg('rae', w);
  }
  showStage();
}

function showAccess(){
  if (tier === 'free') {
    accessEl.innerHTML = `<button class="access-link" id="openCode">Have an access code?</button>
      <div class="code-row" id="codeRow">
        <input id="codeInput" type="text" placeholder="Enter your code" autocomplete="off" aria-label="Access code">
        <button id="codeBtn">Unlock</button>
      </div>
      <div class="code-msg" id="codeMsg" aria-live="polite"></div>`;
    document.getElementById('openCode').onclick = () => {
      document.getElementById('codeRow').classList.add('open');
      document.getElementById('codeInput').focus();
    };
    const go = () => unlock(document.getElementById('codeInput').value);
    document.getElementById('codeBtn').onclick = go;
    document.getElementById('codeInput').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  } else {
    accessEl.innerHTML = `<span class="badge">${TIER_NAMES[tier]} <button id="lockOut">Sign out</button></span><span class="stage" id="stageLine"></span>`;
    document.getElementById('lockOut').onclick = () => {
      accessCode = ''; tier = 'free'; stage = ''; store('madCode', null);
      showAccess(); resetChat();
    };
  }
}

async function unlock(code, silent){
  code = (code || '').trim();
  const msg = document.getElementById('codeMsg');
  if (!code) return;
  if (msg) msg.textContent = 'Checking…';
  try {
    const res = await fetch('/api/mad', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'verify', code })
    });
    const data = await res.json();
    if (data && data.ok) {
      accessCode = code; tier = data.tier; store('madCode', code);
      showAccess(); resetChat();
    } else {
      store('madCode', null);
      if (msg && !silent) msg.textContent = "That code didn't work. Check it and try again, or email info@bookwithmad.com.";
    }
  } catch (e) {
    if (msg && !silent) msg.textContent = 'Something went wrong. Try again in a moment.';
  }
}

async function sendToRae(text){
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  addMsg('user', text);
  history.push({ role:'user', content:text });

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'RAE is typing…';
  msgsEl.appendChild(typing);
  msgsEl.scrollTop = msgsEl.scrollHeight;

  const fallback = `My signal cut out for a second. Try that again, or book a call: ${BOOK_CALL}`;
  try {
    const res = await fetch('/api/mad', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ code: accessCode, stage, who, blueprint: tier === 'blueprint' ? blueprint : '', messages: history.slice(-11) })
    });
    const data = await res.json();
    typing.remove();
    if (res.status === 401) {
      accessCode = ''; tier = 'free'; store('madCode', null); showAccess();
      addMsg('rae', "Your access code isn't working anymore, so I switched you back to the free version. Tap \"Have an access code?\" to try it again.");
      history.pop();
    } else {
      const reply = (data && data.reply) ? data.reply : fallback;
      const shown = addMsg('rae', reply);
      if (data && data.reply) { history.push({ role:'assistant', content:shown }); saveProgress(); } else history.pop();
    }
  } catch (err) {
    typing.remove();
    addMsg('rae', fallback);
    history.pop();
  }
  busy = false; sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', () => { const t = input.value; input.value = ''; sendToRae(t); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const t = input.value; input.value = ''; sendToRae(t); } });

showAccess();
setChips();
if (who.name) resetChat();
const saved = load('madCode');
if (saved) unlock(saved, true);
</script>
