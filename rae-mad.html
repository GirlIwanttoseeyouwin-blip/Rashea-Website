<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask RAE · MAD Business Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F6;
    --white:#FFFFFF;
    --charcoal:#2A2A29;
    --gray:#6F7272;
    --green:#008000;
    --green-dark:#006400;
    --gold:#DDB750;
    --line:rgba(42,42,41,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--charcoal);
    font-family:'Jost', sans-serif; font-size:16px; line-height:1.55;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  header{background:var(--white); text-align:center; padding:20px 22px 0; border-bottom:4px solid var(--green);}
  .logo{display:block; width:min(340px, 82vw); height:auto; margin:0 auto;}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  .sub{
    color:var(--charcoal); font-size:14px; font-weight:500; padding:12px 0 14px;
    border-top:1px solid var(--gold); margin:14px auto 0; max-width:420px;
  }

  main{flex:1; display:flex; flex-direction:column; max-width:640px; width:100%; margin:0 auto;}
  #msgs{flex:1; overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:12px;}
  .msg{max-width:86%; padding:12px 16px; border-radius:14px; font-size:15px; white-space:pre-wrap; word-wrap:break-word;}
  .rae-m{background:var(--white); color:var(--charcoal); align-self:flex-start; border-left:3px solid var(--green); border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(42,42,41,0.08);}
  .rae-m b{color:var(--green); font-weight:600; letter-spacing:.02em;}
  .rae-m a{color:var(--green-dark); font-weight:600;}
  .user-m{background:var(--charcoal); color:var(--white); align-self:flex-end; border-bottom-right-radius:4px;}
  .typing{align-self:flex-start; color:var(--gray); font-style:italic; font-size:14px; padding-left:6px;}

  .chips{display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 12px;}
  .chip{
    background:var(--white); color:var(--charcoal); border:1px solid var(--line);
    border-radius:999px; padding:8px 14px; font:500 13px 'Jost', sans-serif; cursor:pointer;
  }
  .chip:hover{border-color:var(--green); color:var(--green);}

  .input-row{display:flex; gap:8px; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--white);}
  .input-row input{
    flex:1; background:var(--bg); color:var(--charcoal); border:1px solid var(--line);
    border-radius:999px; padding:13px 18px; font:16px 'Jost', sans-serif;
  }
  .input-row input::placeholder{color:var(--gray);}
  .input-row button{
    background:var(--green); color:#fff; border:0; border-radius:999px; padding:0 22px;
    font:600 15px 'Jost', sans-serif; cursor:pointer;
  }
  .input-row button:hover{background:var(--green-dark);}
  .input-row button:disabled{opacity:.5; cursor:default;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
</style>
</head>

l check is a SOFT pull that does not affect personal credit score; a hard inquiry may occur later ONLY if the applicant accepts an offer that requires one — never say "they will never pull your credit," always keep that distinction. Documents typically needed: the most recent 3 months of business bank statements, plus basic business/owner info. If someone asks "do you think I qualify," it's fine to ask casually: (1) how long have you been in business, (2) approximately how much does your business gross per month, (3) does that revenue consistently flow through a business bank account — that's enough for a quick conversation. NEVER ask for or request someone send: Social Security number, bank account number, bank login, full credit report, tax returns, or other highly sensitive financial info — the applicant provides that only through iFundYou's own secure application. DO NOT self-disqualify people — don't tell someone not to apply just because credit isn't perfect, they were denied by a bank before, they're unsure if revenue is high enough, or they haven't operated for years; if they're reasonably close to the basic qualifications, let the funding company make the decision — there's no need to schedule a consultation with Rashea first, and no need to speak with her at all before applying. NEVER say someone is approved, pre-approved, or guaranteed funding/a specific amount/a specific rate — that determination is only iFundYou's to make; instead say things like "check your funding options" or "see what you may qualify for." Never present Rashea as the lender. Trigger phrases to recognize as a funding conversation: "I need funding/capital/money for my business," "I need working capital," "money for inventory," "money to expand," "can you help me get business funding" — respond by naming iFundYou as a door and sharing the link, no consultation required first. Link: https://apply.ifundyou.com/start/starthere/?ref=rasheaedmond

s need fits here (especially business formation/foundation, accounting, bookkeeping, tax, nonprofit fiscal operations), say something like "Rashea can connect you with one of her resource partners" rather than promising she'll personally handle it.

const msgsEl = document.getElementById('msgs');
const input  = document.getElementById('raeInput');
const sendBtn = document.getElementById('raeSend');
let history = [];
let busy = false;

function linkify(text){
  return text.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
    let trail = '';
    while (/[.,!?;:)]$/.test(url)) { trail = url.slice(-1) + trail; url = url.slice(0, -1); }
    return `<a href="${url}" target="_blank" rel="noopener">${url}</a>${trail}`;
  });
}

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user-m' : 'rae-m');
  if (role === 'user') { div.textContent = text; }
  else { div.innerHTML = '<b>RAE:</b> ' + linkify(text.replace(/&/g,'&amp;').replace(/</g,'&lt;')); }
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function sendToRae(text){
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  addMsg('user', text);
  history.push({ role:'user', content:text });

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'RAE is typing…';
  msgsEl.appendChild(typing);
  msgsEl.scrollTop = msgsEl.scrollHeight;

  const fallback = `My signal cut out for a second. Try that again, or book a call: ${BOOK_CALL}`;
  try {
    const res = await fetch('/api/rae', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ system: RAE_SYSTEM, messages: history.slice(-11) })
    });
    const data = await res.json();
    typing.remove();
    let reply = fallback;
    if (data && data.content) {
      reply = data.content.map(c => c.type === 'text' ? c.text : '').join('\n').trim() || fallback;
    }
    addMsg('rae', reply);
    history.push({ role:'assistant', content:reply });
  } catch (err) {
    typing.remove();
    addMsg('rae', fallback);
    history.pop();
  }
  busy = false; sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', () => { const t = input.value; input.value = ''; sendToRae(t); });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const t = input.value; input.value = ''; sendToRae(t); } });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => sendToRae(c.dataset.q)));
</script>
